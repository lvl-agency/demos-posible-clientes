<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demos</title>
  <style>
    :root {
      --ink: #1a1a1a;
      --muted: #6b6560;
      --line: #e4dfd8;
      --paper: #f6f3ee;
      --accent: #8c3a2f;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: var(--paper);
      color: var(--ink);
      font-family: "Segoe UI", Helvetica, Arial, sans-serif;
    }

    .wrap {
      max-width: 720px;
      margin: 0 auto;
      padding: 48px 24px 80px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 8px;
    }

    .mark {
      font-size: 13px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-weight: 600;
    }

    .meta {
      font-size: 13px;
      color: var(--muted);
    }

    nav a {
      display: block;
      padding: 28px 0;
      border-bottom: 1px solid var(--line);
      color: inherit;
      text-decoration: none;
      font-size: clamp(28px, 5vw, 44px);
      font-weight: 500;
      letter-spacing: -0.03em;
      line-height: 1.1;
    }

    nav a:hover,
    nav a:focus-visible {
      color: var(--accent);
    }

    nav a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 4px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <p class="mark">Plantillas De clinicas Esteticas</p>
      <p class="meta">Demos</p>
    </header>
    <nav>
      <a href="plantilla-1/index.html">Plantilla 1</a>
      <a href="plantilla-2/index.html">Plantilla 2</a>
    </nav>
  </div>
</body>
</html>
